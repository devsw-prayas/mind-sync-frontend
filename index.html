<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/solar:brain-bold-duotone.svg?color=%23235361" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindSync | Predictive Mental Health Monitor</title>
    <meta name="description" content="Screening / risk indication from wearable actigraphy. Not a diagnosis." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Same Tailwind Play CDN + config the Stitch canonical designs use, so output matches 1:1 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "border-light": "#E5E7EB",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#636565",
              "on-error": "#ffffff",
              "surface": "#f9f9fa",
              "on-tertiary-container": "#e1e3e3",
              "primary-container": "#3d6b7a",
              "on-background": "#1a1c1d",
              "tertiary-fixed": "#e1e3e3",
              "on-surface-variant": "#41484b",
              "on-secondary-fixed-variant": "#41484b",
              "on-primary-fixed": "#001f27",
              "surface-variant": "#e2e2e3",
              "surface-dim": "#d9dadb",
              "sage-status": "#8DA399",
              "inverse-surface": "#2e3132",
              "surface-container-low": "#f3f3f4",
              "on-secondary-container": "#5e6569",
              "on-surface": "#1a1c1d",
              "midnight-navy": "#12191C",
              "tertiary-fixed-dim": "#c5c7c7",
              "surface-container-high": "#e8e8e9",
              "primary-fixed": "#bbeafb",
              "error-container": "#ffdad6",
              "secondary-fixed": "#dce4e8",
              "surface-bright": "#f9f9fa",
              "on-tertiary-fixed": "#191c1c",
              "inverse-on-surface": "#f0f1f2",
              "warm-grey-bg": "#F9FAFA",
              "on-secondary": "#ffffff",
              "secondary-fixed-dim": "#c0c8cb",
              "surface-container-highest": "#e2e2e3",
              "outline": "#71787b",
              "surface-tint": "#366573",
              "on-secondary-fixed": "#161d20",
              "on-tertiary-fixed-variant": "#454747",
              "outline-variant": "#c0c8cb",
              "primary": "#235361",
              "inverse-primary": "#9fcedf",
              "secondary": "#585f63",
              "mindsync-teal": "#3D6B7A",
              "secondary-container": "#dce4e8",
              "on-primary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "error": "#ba1a1a",
              "on-primary-container": "#bbeafc",
              "on-error-container": "#93000a",
              "primary-fixed-dim": "#9fcedf",
              "surface-container": "#edeeef",
              "background": "#f9f9fa",
              "on-primary-fixed-variant": "#1b4d5b",
              "tertiary": "#4b4d4e",
              "coral-status": "#D68C7E"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: {
              "container-padding-mobile": "24px",
              "container-padding-desktop": "64px",
              "stack-lg": "48px",
              "stack-md": "24px",
              "gutter": "32px",
              "unit": "8px"
            },
            fontFamily: {
              "display-lg": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "label-md": ["Inter"],
              "label-sm": ["Inter"]
            },
            fontSize: {
              "display-lg": ["56px", { lineHeight: "72px", letterSpacing: "-0.03em", fontWeight: "700" }],
              "headline-lg": ["40px", { lineHeight: "52px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "headline-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "headline-md": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "body-lg": ["18px", { lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "400" }],
              "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
              "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }]
            }
          }
        }
      };
    </script>
    <style>
      body { background-color: #f9f9fa; color: #1a1c1d; font-family: "Plus Jakarta Sans", sans-serif; }
      .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
      .material-symbols-outlined.filled { font-variation-settings: "FILL" 1; }
      .soft-shadow { box-shadow: 0px 4px 20px rgba(18, 25, 28, 0.04); }
      .shadow-ultra-soft { box-shadow: 0px 4px 20px rgba(18, 25, 28, 0.04); }
      .shadow-soft { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
      .bento-card { background-color: #ffffff; border-radius: 16px; padding: 32px; border: 1px solid #E5E7EB; }
      .pulse-border { animation: pulse-ring 2s cubic-bezier(0.215,0.61,0.355,1) infinite; }
      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(186,26,26,0.7); }
        70% { box-shadow: 0 0 0 10px rgba(186,26,26,0); }
        100% { box-shadow: 0 0 0 0 rgba(186,26,26,0); }
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
